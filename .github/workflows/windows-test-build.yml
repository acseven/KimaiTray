name: Windows Test Build

# Unsigned Windows installers for manual testing. Runs on pushes to this
# branch and publishes them to a private draft release.
on:
  push:
    branches: ["ci/windows-test-build"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, aarch64-pc-windows-msvc]
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - name: Install repository Rust toolchain and target
        id: rust
        run: |
          rustup show active-toolchain
          rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri -> target
          key: ${{ matrix.target }}
      - name: Install npm dependencies
        id: npm
        run: npm ci
      # No updater signing key in this fork, so skip updater artifacts.
      - name: Build installers
        id: build
        shell: bash
        run: |
          set -o pipefail
          npm run tauri build -- --verbose --target ${{ matrix.target }} --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee build.log
      - name: Merge localized MSIs into one multilingual MSI
        id: merge
        shell: pwsh
        run: ./scripts/merge-msi-languages.ps1 -BundleDir src-tauri/target/${{ matrix.target }}/release/bundle/msi *>&1 | Tee-Object -FilePath merge.log
      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kimaitray-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/merged/*.msi
          if-no-files-found: error
          retention-days: 14
      - name: Publish draft test release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="test-${GITHUB_SHA::7}-${{ matrix.target }}"
          gh release create "$tag" --draft --prerelease --target "$GITHUB_SHA" \
            --title "Windows test build ${GITHUB_SHA::7} (${{ matrix.target }})" \
            --notes "Unsigned test build of $GITHUB_REF_NAME. Not for distribution." \
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe \
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/merged/*.msi
      # Job logs are not always reachable; keep them with a private draft.
      - name: Publish failure logs
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "rust: ${{ steps.rust.outcome }}"
            echo "npm: ${{ steps.npm.outcome }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "merge: ${{ steps.merge.outcome }}"
            ls -R src-tauri/target/${{ matrix.target }}/release/bundle 2>&1 | head -50
          } > status.log
          echo "== build log" > build-tail.log
          [ -f build.log ] && tail -c 900000 build.log >> build-tail.log
          echo "== merge log" > merge-tail.log
          [ -f merge.log ] && cat merge.log >> merge-tail.log
          tag="log-${GITHUB_SHA::7}-${{ matrix.target }}"
          gh release create "$tag" --draft --title "Build log ${GITHUB_SHA::7} (${{ matrix.target }})" --notes "Failed test build."
          for f in status.log build-tail.log merge-tail.log; do gh release upload "$tag" "$f" || true; done
